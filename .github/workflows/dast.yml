# DAST: ataca la app corriendo (caja negra) con OWASP ZAP baseline (pasivo, no destructivo).
# Manual o semanal: es mas lento y en un entorno real apunta a staging, no a prod.
name: dast

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build y levantar la app
        run: |
          docker build -t lab:dast .
          docker network create lab-net
          docker run -d --name lab-app --network lab-net lab:dast
          sleep 5
      - name: ZAP baseline
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network lab-net -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://lab-app:8080 -r zap.html -J zap.json -I
          # -I: no falla por WARN. Quitarlo cuando quieras que el DAST sea un gate.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: reports/
