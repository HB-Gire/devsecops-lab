# CI: calidad + build + escaneo de la imagen + SBOM.
# Corre en cada push y Pull Request. Si falla, el PR no deberia poder mergearse
# (configurar "Branch protection" -> Require status checks).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Principio de minimo privilegio: el GITHUB_TOKEN solo puede leer el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: devsecops-lab:${{ github.sha }}
  TRIVY_VERSION: "0.69.3"   # ver apuntes: incidente supply chain Trivy (mar-2026). Fijar versiones verificadas.

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      # TODO hardening: fijar cada action a su commit SHA (ej: actions/checkout@<sha> # v4)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests + cobertura
        run: pytest --cov=app --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  build-and-scan:
    name: Build imagen + Trivy + SBOM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: SBOM (CycloneDX) con Syft
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/out" \
            anchore/syft:latest "$IMAGE" -o cyclonedx-json=/out/sbom.cdx.json

      - name: Trivy - vulnerabilidades de la imagen (gate HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/out" \
            aquasec/trivy:${TRIVY_VERSION} image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format table "$IMAGE"

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-reports
          path: reports/
